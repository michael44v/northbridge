<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
  </defs>
  <!-- Shield / Crest Outline -->
  <rect x="5" y="5" width="90" height="90" rx="12" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <rect x="9" y="9" width="82" height="82" rx="9" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6" />

  <!-- Pediment / Temple Roof -->
  <path d="M 25 32 L 50 18 L 75 32 Z" fill="url(#goldGrad)" />
  <rect x="23" y="32" width="54" height="4" rx="1" fill="url(#goldGrad)" />

  <!-- Columns -->
  <rect x="28" y="38" width="6" height="28" rx="1" fill="url(#goldGrad)" />
  <rect x="40" y="38" width="6" height="28" rx="1" fill="url(#goldGrad)" />
  <rect x="54" y="38" width="6" height="28" rx="1" fill="url(#goldGrad)" />
  <rect x="66" y="38" width="6" height="28" rx="1" fill="url(#goldGrad)" />

  <!-- Base -->
  <rect x="23" y="66" width="54" height="4" rx="1" fill="url(#goldGrad)" />
  <rect x="18" y="70" width="64" height="5" rx="1.5" fill="url(#goldGrad)" />

  <!-- Monogram M T Accent -->
  <path d="M 45 28 L 50 24 L 55 28" stroke="url(#greenGrad)" stroke-width="1.5" fill="none" />
</svg>
